<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function (location) {
        var pathSegmentsToKeep = 1;
        var basePath = location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var route = location.pathname
          .slice(1 + pathSegmentsToKeep)
          .replace(/&/g, '~and~');
        var query = location.search ? location.search.slice(1).replace(/&/g, '~and~') : '';

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            basePath +
            '/?/' +
            route +
            (query ? '&' + query : '') +
            location.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
